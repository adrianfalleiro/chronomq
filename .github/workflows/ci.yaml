name: Build, Test and Publish Docker Image

on:
  push:
    tags-ignore:
      - "v*" # e.g. v2.1.0

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Install Ginkgo CLI
        run: go install github.com/onsi/ginkgo/ginkgo@v1

      - name: Run tests
        run: |
          make test

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux go build -o chronomq .
